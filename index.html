<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>EXE to SWF extractor</title><style>*{    box-sizing:border-box;    margin:0;    padding:0;}body{    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;    background:#f5f5f5;    color:#222;    padding:40px 20px;}.container{    max-width:820px;    margin:auto;    background:#fff;    border:1px solid #ddd;    border-radius:10px;    padding:24px;    box-shadow:0 2px 10px rgba(0,0,0,.05);}h1{    font-size:24px;    margin-bottom:8px;}.subtitle{    color:#666;    margin-bottom:24px;}input[type=file]{    width:100%;    padding:10px;    border:1px solid #ccc;    border-radius:6px;    background:#fff;}.status{    margin:18px 0;    font-size:14px;    color:#555;}textarea{    width:100%;    height:220px;    resize:vertical;    padding:10px;    border:1px solid #ccc;    border-radius:6px;    font-family:Consolas,monospace;    font-size:13px;}.downloads{    margin-top:20px;}.downloads h3{    margin-bottom:10px;    font-size:16px;}.download{    display:block;    margin:6px 0;    color:#0a58ca;    text-decoration:none;}.download:hover{    text-decoration:underline;}.footer{    margin-top:25px;    font-size:13px;    color:#666;}.footer a{    color:#0a58ca;}</style></head><body><div class="container"><h1>EXE to SWF extractor</h1><div class="subtitle">Extract embedded SWF from Adobe Flash Projector executables.</div><input id="fileInput" type="file" accept=".exe"><div class="status" id="status">Status: Ready</div><textarea id="log" readonly></textarea><div class="downloads" id="downloads"><h3>Downloads</h3></div><div class="footer">Extraction algorithm based on<a href="http://www.nullsecurity.org/article/extracting_swf_from_flash_projector" target="_blank">nullsecurity.org</a></div></div><script>const SIGNATURE = 0xFA123456;const FOOTER_SIZE = 8;const input = document.getElementById("fileInput");const logBox = document.getElementById("log");const downloads = document.getElementById("downloads");const statusLabel = document.getElementById("status");function log(message){    logBox.value += (logBox.value ? "\n" : "") + message;    logBox.scrollTop = logBox.scrollHeight;}function setStatus(text){    statusLabel.textContent = "Status: " + text;}function clearDownloads(){    downloads.innerHTML = "<h3>Downloads</h3>";}function createDownload(filename,data){    const blob = new Blob(        [data],        {type:"application/x-shockwave-flash"}    );    const url = URL.createObjectURL(blob);    const link = document.createElement("a");    link.className = "download";    link.href = url;    link.download = filename + ".swf";    link.textContent = "? " + link.download;    downloads.appendChild(link);    link.click();    setTimeout(()=>{        URL.revokeObjectURL(url);    },1000);}function extractSWF(bytes){    if(bytes.length < FOOTER_SIZE)        throw new Error("File is too small.");    const view = new DataView(        bytes.buffer,        bytes.byteOffset,        bytes.byteLength    );    const signature =        view.getUint32(bytes.length - 8,true);    if(signature !== SIGNATURE)        throw new Error("Flash Projector signature not found.");    const swfLength =        view.getUint32(bytes.length - 4,true);    if(swfLength <= 0)        throw new Error("Invalid SWF length.");    if(swfLength > bytes.length - FOOTER_SIZE)        throw new Error("SWF length exceeds available data.");    const start = bytes.length - FOOTER_SIZE - swfLength;    const end = bytes.length - FOOTER_SIZE;    return bytes.slice(start,end);}input.addEventListener("change",async(event)=>{    const file = event.target.files[0];    if(!file)        return;    log("");    log("================================================");    log("Reading: " + file.name);    log("File Size: " + file.size.toLocaleString() + " bytes");    clearDownloads();    setStatus("Reading file...");    try{        const buffer = await file.arrayBuffer();        const bytes = new Uint8Array(buffer);        log("Loaded into memory.");        setStatus("Extracting...");        const swf = extractSWF(bytes);        log("Flash Projector signature verified.");        log("SWF Size: " + swf.length.toLocaleString() + " bytes");        createDownload(file.name,swf);        log("Extraction completed successfully.");        setStatus("Done");    }    catch(err){        log("ERROR: " + err.message);        setStatus("Failed");    }});</script></body></html>
